<title>Healthy7 Launch Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one keystone card (SOT) on top, then three category bands of equal square-ish cards; dependencies drawn as animated lines over the board. Single light theme by request. */
:root{
  --bg:#F3F7F5; --surface:#FFFFFF; --ink:#14231D; --muted:#5E6F68; --line:#DFE8E3; --soft:#EAF1ED;
  --done:#1E9E6A; --done-bg:#E2F5EC;
  --prog:#2F7BE8; --prog-bg:#E4EEFD;
  --lock:#E2553F; --lock-bg:#FDE9E5;
  --key:#D99A00;  --key-bg:#FFF3D1;
  --wait:#8A5BD6; --wait-bg:#F0E8FC;
  --open:#6B7C75; --open-bg:#EAF0ED;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:20px;padding-block:28px 64px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
button{font:inherit;color:inherit}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.head{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
.head h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1.02;margin:0;letter-spacing:-.02em;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.count{display:flex;align-items:baseline;gap:8px;color:var(--muted)}
.count b{font-family:var(--display);font-size:34px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.tabs{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;padding:9px 18px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,35,29,.12)}
.tabs button:focus-visible,.card:focus-visible,.chip:focus-visible,.x:focus-visible,.rel:focus-visible{outline:2px solid var(--prog);outline-offset:2px}

/* summary */
.sum{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--soft);gap:2px}
.bar span{display:block;height:100%}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px}
.stat{display:flex;align-items:center;gap:8px;color:var(--muted)}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:13px}
.hint{color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
.note{background:var(--wait-bg);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}

/* state colours */
.s-done{color:var(--done);background:var(--done-bg)}
.s-prog{color:var(--prog);background:var(--prog-bg)}
.s-lock{color:var(--lock);background:var(--lock-bg)}
.s-key{color:var(--key);background:var(--key-bg)}
.s-wait{color:var(--wait);background:var(--wait-bg)}
.s-open{color:var(--open);background:var(--open-bg)}
.f-done{background:var(--done)}.f-prog{background:var(--prog)}.f-lock{background:var(--lock)}.f-wait{background:var(--wait)}.f-open{background:#B9C6C0}

/* board */
.board{position:relative;display:flex;flex-direction:column;gap:30px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0;display:flex;align-items:baseline;gap:10px}
.sec h2 small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;min-width:0;transition:transform .18s,box-shadow .18s,opacity .25s,border-color .18s;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(20,35,29,.08)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none}
.stars{display:flex;gap:1px;font-size:14px;color:#D5DED9}
.stars svg{width:1em;height:1em;fill:currentColor}
.stars .on{color:var(--key)}
.card h3{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.15;margin:0;text-wrap:balance}
.card h3 small{display:block;font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--muted);margin-top:3px}
.sts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;margin-top:auto}
.chip{display:flex;align-items:center;gap:7px;width:100%;border:0;border-radius:9px;padding:5px 8px;font-size:12.5px;font-weight:600;text-align:left;line-height:1.25;min-width:0}
.chip .i{font-size:14px}
.chip .lb{flex:1;min-width:0}
.chip .tm{font-weight:500;opacity:.85;white-space:nowrap;font-variant-numeric:tabular-nums}
button.chip{cursor:help;box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .15s}
button.chip:hover,button.chip.pin{box-shadow:inset 0 0 0 1.5px currentColor}
.flag{font-size:12px;color:var(--wait);font-weight:600}

/* SOT keystone */
.split{display:grid;grid-template-columns:250px minmax(0,1fr);gap:72px;align-items:start}
.sot{position:sticky;top:max(20px,calc(50vh - 140px))}
.sot .card{padding:22px;gap:14px;border-color:#F0D58A;background:linear-gradient(180deg,#FFFDF5,#FFFFFF)}
.sot .ico{width:56px;height:56px;font-size:28px;border-radius:16px}
.sot h3{font-size:24px}
.sot .stars{font-size:18px}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr);gap:22px}.sot{position:static}}

.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr);gap:30px}}
/* task columns: one row per task */
.rows{display:flex;flex-direction:column;gap:8px}
.row{flex-direction:row;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:10px 14px}
.row .ico{width:36px;height:36px;font-size:19px;border-radius:10px}
.row .mid{flex:1 1 150px;min-width:0}
.row h3{font-size:16px}
.row .sts{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;margin:0;gap:6px}
.row .chip{width:auto}
.row .stars{width:72px;justify-content:flex-end}
.wires.still .w-base{animation:none;stroke-dashoffset:0}
.wires.still .w-flow{animation:flow .7s linear infinite;opacity:1}
.wires.still .w-end{animation:none;opacity:1}

/* tracing */
.board.tracing .card{opacity:.28}
.board.tracing .card.hl-key{opacity:1;border-color:var(--key);box-shadow:0 0 0 3px var(--key-bg),0 10px 26px rgba(217,154,0,.22)}
.board.tracing .card.hl-lock{opacity:1;border-color:var(--lock);box-shadow:0 0 0 3px var(--lock-bg)}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
.w-base{fill:none;stroke:var(--key);stroke-width:5;opacity:.22;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s ease-out forwards}
.w-flow{fill:none;stroke:var(--key);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:3 9;opacity:0;animation:flow .7s linear infinite,fade .3s .25s forwards}
.w-end{fill:var(--surface);stroke:var(--lock);stroke-width:2.5;opacity:0;animation:fade .2s .4s forwards}
.w-dot{fill:var(--key)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,35,29,.28);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--surface);z-index:21;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:calc(22px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:18px;box-shadow:-12px 0 40px rgba(20,35,29,.14)}
.drawer.on{transform:none}
.drawer .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:36px;height:36px;border-radius:10px;border:0;background:var(--soft);cursor:pointer;font-size:18px;display:grid;place-items:center}
.drawer h2{font-family:var(--display);font-size:26px;line-height:1.1;margin:0;padding-right:40px;text-wrap:balance}
.drawer .cat{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dh{display:flex;gap:14px;align-items:center}
.dh .ico{width:52px;height:52px;font-size:26px}
.blk{display:flex;flex-direction:column;gap:8px}
.blk h4{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.blk ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.dod li{display:flex;gap:9px;align-items:flex-start}
.dod li::before{content:"";width:16px;height:16px;border-radius:5px;border:1.6px solid #B9C6C0;flex:none;margin-top:2px}
.owner{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600;color:var(--muted)}
.muted{color:var(--muted);font-size:13.5px}
.rel{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer;width:100%;text-align:left;font-weight:600}
.rel:hover{background:var(--soft)}
.rel .i{font-size:16px}

/* editing */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#24382F}
.btn.danger{color:var(--lock);border-color:var(--lock-bg)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.add:focus-visible,.form input:focus-visible,.form select:focus-visible,.form textarea:focus-visible,.pk:focus-visible{outline:2px solid var(--prog);outline-offset:2px}
.add{border:1.5px dashed #C3D0CA;background:transparent;border-radius:var(--r);padding:10px;color:var(--muted);font-weight:600;cursor:pointer;width:100%}
.add:hover{background:var(--surface);color:var(--ink)}
.empty{color:var(--muted);padding:28px 12px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r)}
.form{display:flex;flex-direction:column;gap:14px}
.form label,.form .fl{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;min-width:0}
.form input,.form select,.form textarea{font:inherit;font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--surface);border:1px solid #CBD7D1;border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.form textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pks{display:flex;flex-wrap:wrap;gap:6px}
.pk{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;cursor:pointer;color:var(--muted)}
.pk.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pk.star{border:0;width:30px;color:#D5DED9;font-size:24px;background:transparent}
.pk.star svg{width:1em;height:1em;fill:currentColor}
.pk.star.on{color:var(--key);background:transparent}
.srow{display:grid;grid-template-columns:118px minmax(0,1fr) 36px;gap:6px;padding:8px;border-radius:12px;background:var(--bg)}
.srow .wide{grid-column:1/-1}
.err{color:var(--lock);font-weight:600;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .sp{flex:1}

@media (max-width:520px){.sot h3{font-size:21px}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.card{padding:12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.w-base{stroke-dashoffset:0}.w-flow,.w-end{opacity:1}.w-dot{display:none}}
</style>

<div class="scrim" id="scrim"></div>

<script>
/* Tasks live in the artifact database, collection "tasks", one document per task:
   {title, sub, cat, icon, stars, owner, flag, info, order, dod:[...], st:[{t,label,time,by}]}
   st.t: done | prog | lock | wait | open.  lock.by = id of the blocking task. */
const TEAM=['Philippe','Kevin','Bastiaan','Velizar','Vladimir','Stefan','Tihomir'];
const CATS={sot:'Foundation',pages:'Pages',payments:'Payments',legal:'Legal'};
const VIEWS={pre:['sot','pages'],full:['payments','legal']};
const ICONS=['target','home','box','flask','leaf','jar','users','help','mail','scale','user','pen','send','cart','card','sync','shield','clip','tag','truck','file','receipt','boxes'];
const TYPES=['done','prog','lock','wait','open'];
const NAMES={done:'Done',prog:'In progress',lock:'Locked',key:'Unlocks others',wait:'Waiting',open:'To do'};
const ORDER=['lock','prog','wait','open','done'];
const LAUNCH=new Date(2026,9,15);

let TASKS=[], byId={}, db=null, state='loading', canWrite=true, view='pre', pinned=null, cur=null, openId=null, editing=null;

const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,p='i')=>`<svg class="i"><use href="#${p}-${n}"/></svg>`;
const blockers=t=>[...new Set(t.st.filter(s=>s.t==='lock'&&byId[s.by]).map(s=>s.by))];
const unlocks=id=>TASKS.filter(t=>blockers(t).includes(id));
const primary=t=>ORDER.find(k=>t.st.some(s=>s.t===k));
const isDone=t=>t.st.every(s=>s.t==='done');
const short=t=>t.id==='sot'?'SOT':t.title.replace(/ setup$/,'').replace('Shopify business verification','Shopify verification');
const canEdit=()=>!!db&&canWrite;
function visible(){return TASKS.filter(t=>VIEWS[view].includes(t.cat))}

function norm(id,d){
  const st=(Array.isArray(d.st)?d.st:[]).filter(s=>s&&typeof s==='object').map(s=>({t:TYPES.includes(s.t)?s.t:'open',label:String(s.label||''),time:String(s.time||''),by:String(s.by||'')}));
  return {id,title:String(d.title||'Untitled'),sub:String(d.sub||''),cat:Object.hasOwn(CATS,d.cat)?d.cat:'pages',icon:ICONS.includes(d.icon)?d.icon:'file',
    stars:Math.max(0,Math.min(5,d.stars|0)),owner:TEAM.includes(d.owner)?d.owner:null,flag:String(d.flag||''),info:String(d.info||''),
    st:st.length?st:[{t:'open',label:'To do',time:'',by:''}],dod:(Array.isArray(d.dod)?d.dod:[]).map(String),order:+d.order||0};
}

function chip(t,s){
  const bt=s.t==='lock'?byId[s.by]:null;
  const tm=s.time?`<span class="tm">${esc(s.t==='lock'?'then '+s.time:s.time)}</span>`:'';
  const lb=esc(s.label||NAMES[s.t])+(bt?` · needs ${esc(short(bt))}`:'');
  const inner=`${ic(s.t)}<span class="lb">${lb}</span>${tm}`;
  if(s.t==='key'||bt)
    return `<li><button class="chip s-${s.t}" data-trace="${s.t}" data-id="${esc(t.id)}" aria-label="${NAMES[s.t]}: ${lb}. Show links">${inner}</button></li>`;
  return `<li><span class="chip s-${s.t}">${inner}</span></li>`;
}
function allSt(t){const n=unlocks(t.id).length;return n?[...t.st,{t:'key',label:`Unlocks ${n} task${n>1?'s':''}`}]:t.st}
function stars(n){if(!n)return '';let h='';for(let i=1;i<=5;i++)h+=`<svg class="${i<=n?'on':''}"><use href="#i-star"/></svg>`;return `<div class="stars" role="img" aria-label="Priority ${n} of 5">${h}</div>`}
const tone=t=>unlocks(t.id).length&&t.cat==='sot'?'key':primary(t);
const head=t=>`<h3>${esc(t.title)}${t.sub?`<small>${esc(t.sub)}</small>`:''}</h3>`;
const flag=t=>t.flag?`<div class="flag">${esc(t.flag)}</div>`:'';
const sts=t=>`<ul class="sts">${allSt(t).map(s=>chip(t,s)).join('')}</ul>`;

function card(t){
  return `<div class="card" data-card="${esc(t.id)}" tabindex="0" role="button"><div class="top"><span class="ico s-${tone(t)}">${ic(t.icon,'t')}</span>${stars(t.stars)}</div>${head(t)}${flag(t)}${sts(t)}</div>`;
}
function row(t){
  return `<div class="card row" data-card="${esc(t.id)}" tabindex="0" role="button"><span class="ico s-${tone(t)}">${ic(t.icon,'t')}</span><div class="mid">${head(t)}${flag(t)}</div>${sts(t)}${stars(t.stars)||'<div class="stars"></div>'}</div>`;
}

function render(){
  const full=view==='full', board=$('#board');
  $('#title').textContent=full?'Full launch':'Pre-order launch';
  const days=Math.round((LAUNCH-new Date(new Date().toDateString()))/864e5);
  $('#count').innerHTML=full?'<span>Date to be set</span>':days>0?`<b>${days}</b><span>day${days>1?'s':''} to 15 Oct</span>`:days===0?'<b>Today</b><span>15 Oct</span>':`<span>Launched 15 Oct</span>`;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===view));
  pinned=null;cur=null;board.classList.remove('tracing');

  if(state!=='ready'){
    $('#bar').innerHTML='';$('#stats').innerHTML='';
    board.innerHTML=`<div class="empty">${state==='loading'?'Loading tasks…':'The task list is not available in this view. Open the board on claude.ai while signed in.'}</div>`;
    return;
  }
  const vis=visible();
  const add=c=>canEdit()?`<button class="add" data-add="${c}">+ Add task</button>`:'';
  const sec=(c,fn)=>{const list=vis.filter(t=>t.cat===c),d=list.filter(isDone).length;
    return `<section class="sec"><h2>${CATS[c]} <small>${d} of ${list.length} done</small></h2><div class="rows">${list.map(t=>fn(t)).join('')||'<div class="empty">No tasks yet</div>'}${add(c)}</div></section>`};
  const sot=vis.filter(t=>t.cat==='sot');
  board.innerHTML=(full?`<div class="cols">${sec('payments',row)}${sec('legal',row)}</div>`
    :`<div class="split"><section class="sec sot">${sot.map(card).join('')||'<div class="empty">No foundation task yet</div>'}</section>${sec('pages',row)}</div>`)
    +'<svg class="wires" id="wires" aria-hidden="true"></svg>';

  const cnt={};vis.forEach(t=>{const p=primary(t);cnt[p]=(cnt[p]||0)+1});
  const seq=['done','prog','wait','open','lock'];
  $('#bar').innerHTML=seq.filter(k=>cnt[k]).map(k=>`<span class="f-${k}" style="flex:${cnt[k]}" title="${NAMES[k]}: ${cnt[k]}"></span>`).join('');
  $('#stats').innerHTML=seq.filter(k=>cnt[k]).map(k=>`<div class="stat"><span class="dot s-${k}">${ic(k)}</span><b>${cnt[k]}</b> ${NAMES[k]}</div>`).join('')
    +`<div class="stat"><span class="dot s-key">${ic('key')}</span><b>${vis.filter(t=>unlocks(t.id).length).length}</b> Unlock others</div>`;
}

/* ---------- dependency tracing ---------- */
function clearTrace(){
  cur=null;
  const b=$('#board');b.classList.remove('tracing');
  b.querySelectorAll('.hl-key,.hl-lock').forEach(e=>e.classList.remove('hl-key','hl-lock'));
  b.querySelectorAll('.chip.pin').forEach(e=>e.classList.remove('pin'));
  const w=$('#wires');if(w)w.innerHTML='';
}
function trace(id,mode){
  clearTrace();if(!byId[id])return;
  cur=mode==='key'?unlocks(id).map(t=>[id,t.id]):blockers(byId[id]).map(b=>[b,id]);
  draw();$('#board').classList.add('tracing');
}
function draw(still){
  const pairs=cur,w=$('#wires');if(!pairs||!w)return;
  const b=$('#board'),br=b.getBoundingClientRect();
  const el=i=>b.querySelector(`[data-card="${CSS.escape(i)}"]`);
  const R=e=>{const r=e.getBoundingClientRect();return{x:r.left-br.left,y:r.top-br.top,w:r.width,h:r.height}};
  let svg='';
  pairs.forEach(([from,to])=>{
    const A=el(from),B=el(to);if(!A||!B)return;
    A.classList.add('hl-key');B.classList.add('hl-lock');
    const a=R(A),c=R(B),ac={x:a.x+a.w/2,y:a.y+a.h/2},cc={x:c.x+c.w/2,y:c.y+c.h/2};
    let d,end;
    if(Math.abs(a.x-c.x)<4&&Math.abs(a.w-c.w)<4){ // same column: loop around the right edge
      const x=a.x+a.w,k=26;d=`M${x},${ac.y} C${x+k},${ac.y} ${x+k},${cc.y} ${x},${cc.y}`;end=[x,cc.y];
    }else if(c.x<a.x+a.w&&a.x<c.x+c.w){
      const dn=cc.y>ac.y,sx=Math.max(a.x+24,Math.min(a.x+a.w-24,cc.x)),y1=dn?a.y+a.h:a.y,y2=dn?c.y:c.y+c.h,k=Math.max(24,Math.abs(y2-y1)/2)*(dn?1:-1);
      d=`M${sx},${y1} C${sx},${y1+k} ${cc.x},${y2-k} ${cc.x},${y2}`;end=[cc.x,y2];
    }else{
      const rt=cc.x>ac.x,x1=rt?a.x+a.w:a.x,x2=rt?c.x:c.x+c.w,k=Math.max(10,Math.abs(x2-x1)/2)*(rt?1:-1);
      d=`M${x1},${ac.y} C${x1+k},${ac.y} ${x2-k},${cc.y} ${x2},${cc.y}`;end=[x2,cc.y];
    }
    svg+=`<path class="w-base" pathLength="1" d="${d}"/><path class="w-flow" d="${d}"/><circle class="w-dot" r="4"><animateMotion dur="1.3s" repeatCount="indefinite" path="${d}"/></circle><circle class="w-end" r="5" cx="${end[0]}" cy="${end[1]}"/>`;
  });
  w.classList.toggle('still',!!still);w.innerHTML=svg;
}
addEventListener('scroll',()=>{if(cur)requestAnimationFrame(()=>draw(true))},{passive:true});
const board=$('#board');
board.addEventListener('mouseover',e=>{const c=e.target.closest('[data-trace]');if(c&&!pinned)trace(c.dataset.id,c.dataset.trace)});
board.addEventListener('mouseout',e=>{const c=e.target.closest('[data-trace]');if(c&&!pinned&&!c.contains(e.relatedTarget))clearTrace()});
board.addEventListener('focusin',e=>{const c=e.target.closest('[data-trace]');if(c&&!pinned)trace(c.dataset.id,c.dataset.trace)});
board.addEventListener('focusout',e=>{if(e.target.closest('[data-trace]')&&!pinned)clearTrace()});
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-trace]');
  if(c){const key=c.dataset.id+c.dataset.trace;
    if(pinned===key){pinned=null;clearTrace()}else{pinned=key;trace(c.dataset.id,c.dataset.trace);c.classList.add('pin')}
    return}
  if(pinned){pinned=null;clearTrace()}
  const a=e.target.closest('[data-add]');if(a)return openEdit(null,a.dataset.add);
  const k=e.target.closest('[data-card]');if(k)openDrawer(k.dataset.card);
});
board.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-card]')){e.preventDefault();openDrawer(e.target.dataset.card)}});
addEventListener('resize',()=>{pinned=null;clearTrace()});

/* ---------- detail drawer ---------- */
let lastFocus=null;
function show(){
  const d=$('#drawer');
  if(!d.classList.contains('on'))lastFocus=document.activeElement;
  d.classList.add('on');d.setAttribute('aria-hidden','false');$('#scrim').classList.add('on');
}
function openDrawer(id,keepScroll){
  const t=byId[id];if(!t)return closeDrawer();
  const d=$('#drawer');openId=id;editing=null;
  const rel=(list,type)=>list.map(x=>`<li><button class="rel" data-go="${esc(x.id)}"><span class="dot s-${type}">${ic(type)}</span>${esc(x.title)}</button></li>`).join('');
  const bl=blockers(t).map(i=>byId[i]),un=unlocks(t.id);
  d.innerHTML=`<button class="x" aria-label="Close">✕</button>
   <div class="dh"><span class="ico s-${tone(t)}">${ic(t.icon,'t')}</span><div><div class="cat">${CATS[t.cat]}</div>${stars(t.stars)||'<span class="muted">Priority not set</span>'}</div></div>
   <h2 id="d-title">${esc(t.title)}</h2>
   ${t.sub?`<div class="muted">${esc(t.sub)}</div>`:''}
   ${t.flag?`<div class="flag">${esc(t.flag)}</div>`:''}
   ${t.info?`<div class="note">${esc(t.info)}</div>`:''}
   <div class="blk"><h4>Status</h4><ul class="sts">${allSt(t).map(s=>{const bt=s.t==='lock'?byId[s.by]:null;return `<li><span class="chip s-${s.t}">${ic(s.t)}<span class="lb">${esc(s.label||NAMES[s.t])}${bt?` · blocked by ${esc(bt.title)}`:''}</span>${s.time?`<span class="tm">${esc(s.t==='lock'?s.time+' once unlocked':s.time)}</span>`:''}</span></li>`}).join('')}</ul></div>
   <div class="blk"><h4>Done when</h4>${t.dod.length?`<ul class="dod">${t.dod.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<div class="muted">Details to be added.</div>'}</div>
   <div class="blk"><h4>Owner</h4><div class="owner"><span class="av">${t.owner?esc(t.owner[0]):'?'}</span><div>${t.owner?`<b>${esc(t.owner)}</b>`:`<b>Not assigned yet</b>`}</div></div></div>
   ${bl.length?`<div class="blk"><h4>Blocked by</h4><ul>${rel(bl,'key')}</ul></div>`:''}
   ${un.length?`<div class="blk"><h4>Unlocks</h4><ul>${rel(un,'lock')}</ul></div>`:''}
   ${canEdit()?`<div class="actions"><button class="btn primary" data-act="edit">Edit task</button></div>`:''}`;
  show();
  if(!keepScroll){d.scrollTop=0;d.querySelector('.x').focus()}
}
function closeDrawer(){const d=$('#drawer');openId=null;editing=null;if(!d.classList.contains('on'))return;d.classList.remove('on');d.setAttribute('aria-hidden','true');$('#scrim').classList.remove('on');if(lastFocus&&lastFocus.focus&&document.contains(lastFocus))lastFocus.focus()}

/* ---------- editing ---------- */
function openEdit(id,cat){
  if(!canEdit())return;
  const t=id?byId[id]:null;if(id&&!t)return;
  editing=t?JSON.parse(JSON.stringify(t)):{id:null,cat:cat||'pages',title:'',sub:'',icon:'file',stars:0,owner:null,flag:'',info:'',st:[{t:'open',label:'To do',time:'',by:''}],dod:[],order:0};
  openId=id||null;renderEdit();show();
  const d=$('#drawer');d.scrollTop=0;$('#f-title').focus();
}
function renderEdit(confirmDel){
  const e=editing,d=$('#drawer'),top=d.scrollTop;
  const opt=(v,l,sel)=>`<option value="${esc(v)}"${sel?' selected':''}>${esc(l)}</option>`;
  const others=TASKS.filter(t=>t.id!==e.id);
  const srow=(s,i)=>`<div class="srow">
    <select id="f-st-${i}-t" class="st-t" aria-label="Status type">${TYPES.map(k=>opt(k,NAMES[k],s.t===k)).join('')}</select>
    <input id="f-st-${i}-l" class="st-l" aria-label="Status label" placeholder="Label, e.g. Copy" value="${esc(s.label)}">
    <button type="button" class="pk" data-act="rm-st" data-i="${i}" aria-label="Remove status">✕</button>
    <input id="f-st-${i}-m" class="st-m wide" aria-label="Time" placeholder="${s.t==='lock'?'Work once unlocked, e.g. 1h':s.t==='prog'?'Time left, e.g. 2h left':'Time (optional), e.g. 1d'}" value="${esc(s.time)}">
    ${s.t==='lock'?`<select id="f-st-${i}-b" class="st-b wide" aria-label="Blocked by">${opt('','Blocked by…',!s.by)}${others.map(t=>opt(t.id,t.title,s.by===t.id)).join('')}</select>`:''}
  </div>`;
  d.innerHTML=`<button class="x" aria-label="Close" type="button">✕</button>
  <h2 id="d-title">${e.id?'Edit task':'New task'}</h2>
  <form class="form" id="f" novalidate>
    <label>Title<input id="f-title" value="${esc(e.title)}" maxlength="120"></label>
    <label>Subtitle<input id="f-sub" value="${esc(e.sub)}" maxlength="160" placeholder="Optional"></label>
    <div class="two">
      <label>Category<select id="f-cat">${Object.keys(CATS).map(k=>opt(k,CATS[k],e.cat===k)).join('')}</select></label>
      <label>Owner<select id="f-owner">${opt('','Not assigned',!e.owner)}${TEAM.map(n=>opt(n,n,e.owner===n)).join('')}</select></label>
    </div>
    <div class="fl">Priority<div class="pks">${[1,2,3,4,5].map(i=>`<button type="button" class="pk star${i<=e.stars?' on':''}" data-star="${i}" aria-label="${i} star${i>1?'s':''}"><svg><use href="#i-star"/></svg></button>`).join('')}</div></div>
    <div class="fl">Icon<div class="pks">${ICONS.map(n=>`<button type="button" class="pk${e.icon===n?' on':''}" data-icon="${n}" aria-label="${n}">${ic(n,'t')}</button>`).join('')}</div></div>
    <div class="fl">Statuses${e.st.map(srow).join('')}<button type="button" class="add" data-act="add-st">+ Add status</button></div>
    <label>Done when (one per line)<textarea id="f-dod">${esc(e.dod.join('\n'))}</textarea></label>
    <label>Note<input id="f-info" value="${esc(e.info)}" maxlength="300" placeholder="Optional"></label>
    <label>Warning tag<input id="f-flag" value="${esc(e.flag)}" maxlength="60" placeholder="Optional, e.g. May miss pre-order"></label>
    <div class="err" id="f-err" hidden></div>
    ${confirmDel?`<div class="actions"><span class="err">Delete this task for everyone?</span><span class="sp"></span><button type="button" class="btn danger" data-act="del-yes">Delete</button><button type="button" class="btn" data-act="del-no">Keep</button></div>`
     :`<div class="actions"><button type="submit" class="btn primary" id="f-save">Save</button><button type="button" class="btn" data-act="cancel">Cancel</button><span class="sp"></span>${e.id?'<button type="button" class="btn danger" data-act="del">Delete</button>':''}</div>`}
  </form>`;
  d.scrollTop=top;
}
function collect(){
  const e=editing,d=$('#drawer'),v=id=>{const x=document.getElementById(id);return x?x.value.trim():''};
  e.title=v('f-title');e.sub=v('f-sub');e.cat=v('f-cat');e.owner=v('f-owner')||null;e.info=v('f-info');e.flag=v('f-flag');
  e.dod=v('f-dod').split('\n').map(x=>x.trim()).filter(Boolean);
  e.st=[...d.querySelectorAll('.srow')].map(r=>{const q=c=>{const x=r.querySelector(c);return x?x.value.trim():''};const t=q('.st-t');
    return {t,label:q('.st-l'),time:q('.st-m'),by:t==='lock'?q('.st-b'):''}});
}
function fail(m){const x=$('#f-err');if(x){x.textContent=m;x.hidden=false}}
const why=e=>e&&e.code==='invalid_argument'?'Not saved. You may not have permission to edit this board.':e&&e.code==='quota_exceeded'?'Not saved. The board is full; delete a task first.':'Not saved. Check your connection and try again.';
async function save(){
  collect();const e=editing;
  if(!e.title)return fail('Give the task a title.');
  if(!e.st.length)e.st=[{t:'open',label:'To do',time:'',by:''}];
  e.st.forEach(s=>{if(!s.label)s.label=s.t==='lock'?'Blocked':NAMES[s.t]});
  const {id,...body}=e;
  if(!id)body.order=TASKS.reduce((m,t)=>Math.max(m,t.order),0)+10;
  const b=$('#f-save');if(b)b.disabled=true;
  try{
    const ref=id?db.doc('tasks/'+id):db.collection('tasks').doc();
    await ref.set(body);
    closeDrawer();
  }catch(err){if(b)b.disabled=false;fail(why(err))}
}
async function remove(){
  try{await db.doc('tasks/'+editing.id).delete();closeDrawer()}catch(err){renderEdit();fail(why(err))}
}
const drawer=$('#drawer');
drawer.addEventListener('click',e=>{
  e.stopPropagation();
  if(e.target.closest('.x'))return closeDrawer();
  const g=e.target.closest('[data-go]');if(g)return openDrawer(g.dataset.go);
  const s=e.target.closest('[data-star]');if(s){collect();const n=+s.dataset.star;editing.stars=editing.stars===n?0:n;return renderEdit()}
  const i=e.target.closest('[data-icon]');if(i){collect();editing.icon=i.dataset.icon;return renderEdit()}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='edit')return openEdit(openId);
  if(act==='cancel')return editing.id?openDrawer(editing.id):closeDrawer();
  if(act==='add-st'){collect();editing.st.push({t:'open',label:'',time:'',by:''});return renderEdit()}
  if(act==='rm-st'){collect();editing.st.splice(+a.dataset.i,1);return renderEdit()}
  if(act==='del'){collect();return renderEdit(true)}
  if(act==='del-no'){collect();return renderEdit()}
  if(act==='del-yes')return remove();
});
drawer.addEventListener('change',e=>{if(e.target.matches('.st-t')){collect();renderEdit()}});
drawer.addEventListener('submit',e=>{e.preventDefault();save()});
$('#scrim').addEventListener('click',closeDrawer);
addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();pinned=null;clearTrace()}});

/* ---------- view tabs ---------- */
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render();try{history.replaceState(null,'',view==='full'?'#full':'#pre')}catch(_){}}));
if(location.hash==='#full')view='full';
render();

/* ---------- data ---------- */
(async()=>{
  const c=window.claude;
  db=c&&c.use?await c.use('db').catch(()=>null):null;
  if(!db){state='gone';return render()}
  c.use('user').then(async u=>{const w=u?await u.can('data.write'):null;if(w===false){canWrite=false;render();if(openId&&!editing)openDrawer(openId,true)}}).catch(()=>{});
  db.collection('tasks').limit(500).onSnapshot(snap=>{
    TASKS=snap.docs.map(d=>norm(d.id,d.data()||{})).sort((a,b)=>a.order-b.order||a.id.localeCompare(b.id));
    byId=Object.fromEntries(TASKS.map(t=>[t.id,t]));
    state='ready';render();
    if(openId&&!editing)byId[openId]?openDrawer(openId,true):closeDrawer();
  },()=>{state='gone';render()});
})();
</script>
